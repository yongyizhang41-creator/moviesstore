{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>Top Commenter</h2>
        <hr />
        {% if template_data.top %}
        <table class="table table-bordered table-striped text-center">
            <thead>
                <tr>
                    <th scope="col">Username</th>
                    <th scope="col">Comments Posted</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>{{ template_data.top.user__username }}</td>
                    <td>{{ template_data.top.total }}</td>
                </tr>
            </tbody>
        </table>
        {% else %}
        <p>No comments have been posted yet.</p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock content %}
